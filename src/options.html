<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Review Link</title>
    <style>
      :root {
        color-scheme: var(--rl-scheme, dark);
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        background: radial-gradient(circle at top, var(--rl-page-start), var(--rl-page-end) 58%);
        color: var(--rl-text);
      }
      main {
        max-width: 560px;
        margin: 48px auto;
        padding: 20px;
        border: 1px solid var(--rl-border);
        border-radius: 18px;
        background: var(--rl-panel-bg);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 24px;
      }
      h2 {
        margin: 22px 0 8px;
        font-size: 15px;
        color: var(--rl-accent);
      }
      p {
        margin: 0;
        color: var(--rl-muted);
        line-height: 1.5;
      }
      label {
        display: block;
        margin: 12px 0 6px;
        color: var(--rl-muted);
        font-size: 13px;
      }
      input,
      select {
        width: 100%;
        min-height: 36px;
        padding: 6px 10px;
        box-sizing: border-box;
        border: 1px solid var(--rl-border);
        border-radius: 10px;
        background: var(--rl-input-bg);
        color: var(--rl-text);
        font: inherit;
      }
      option {
        background: var(--rl-page-end);
      }
      .themes {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 140px));
        gap: 8px;
      }
      .theme {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 10px 4px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: var(--rl-input-bg);
        color: var(--rl-text);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .theme[aria-pressed="true"] {
        border-color: var(--rl-active-border);
        background: var(--rl-active-bg);
      }
      .swatch {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        border: 1px solid var(--rl-border);
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }
      .button {
        min-height: 38px;
        padding: 8px 14px;
        border: 1px solid var(--rl-border);
        border-radius: 12px;
        background: linear-gradient(135deg, var(--rl-primary-start), var(--rl-primary-end));
        color: var(--rl-text);
        font: inherit;
        cursor: pointer;
      }
      .button.secondary {
        background: var(--rl-input-bg);
      }
      #status {
        min-height: 20px;
        margin-top: 10px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 data-i18n="optionsTitle">Review Link</h1>

      <h2 data-i18n="appearance"></h2>
      <label for="language" data-i18n="language"></label>
      <select id="language"></select>
      <label data-i18n="theme"></label>
      <div class="themes" id="themes"></div>

      <h2 data-i18n="tokenLabel"></h2>
      <p data-i18n="tokenHelp"></p>
      <label for="token" data-i18n="tokenLabel"></label>
      <input id="token" type="password" autocomplete="off" placeholder="github_pat_…" />
      <div class="actions">
        <button id="save" class="button" type="button" data-i18n="save"></button>
        <button id="clear" class="button secondary" type="button" data-i18n="clear"></button>
      </div>
      <p id="status"></p>
    </main>
    <script src="settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
